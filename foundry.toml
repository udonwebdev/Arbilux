[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@aave/core-v3/=lib/aave-v3-core/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[lint]
exclude_lints = ["reentrancy-events", "calls-loop", "require-revert-in-loop"]

